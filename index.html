<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompting Fantasy</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        font-family: monospace;
      }
      #stage {
        position: relative;
        display: inline-block;
      }
      #game {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #000;
      }
      #prompt-input {
        position: absolute;
        display: none;
        box-sizing: border-box;
        border: 2px solid #f4e7c0;
        background: #1a1726;
        color: #f4e7c0;
        font-family: monospace;
        outline: none;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game"></canvas>
      <input id="prompt-input" type="text" autocomplete="off" spellcheck="false" />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
